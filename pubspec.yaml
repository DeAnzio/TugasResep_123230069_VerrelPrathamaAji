name: meal_app
description: Aplikasi Resep Masakan - Praktikum Mobile IF-B
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # HTTP requests
  http: ^1.2.1
  # Local storage untuk auth session
  shared_preferences: ^2.2.3
  # Persistent storage untuk favorit
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # State management
  provider: ^6.1.2
  # Image loading
  cached_network_image: ^3.3.1
  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9

flutter:
  uses-material-design: true